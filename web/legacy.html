<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 DirStat</title>
<!-- Panel for the browser of older firmwares: no CSS variables or grid, ES5 only. -->
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1116;color:#e8eaed;font:14px/1.4 sans-serif}
#top{padding:10px 16px;background:#141820;border-bottom:1px solid #262c36}
h1{font-size:18px;margin:0 12px 0 0;display:inline}
#state{color:#97a0ab;margin-left:10px}
#totals{font-weight:bold;margin-left:10px}
button{font:inherit;color:#e8eaed;background:#3d7bfd;border:0;border-radius:8px;padding:6px 16px}
button:focus,.row:focus{outline:2px solid #ffd400}
.row{display:table;width:100%;table-layout:fixed;padding:3px 16px;white-space:nowrap}
.row span{display:table-cell;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.head{color:#97a0ab;border-bottom:1px solid #262c36;background:#141820}
.tw{width:auto;color:#97a0ab}
.nm{width:auto}
.bar{width:110px}
.bar span{display:block;height:10px;background:#3d7bfd}
.sz{width:84px;text-align:right}
.pc{width:60px;text-align:right}
.it{width:70px;text-align:right}
.sel{background:#22324f}
#tree{height:300px;overflow:auto}
#crumbs{padding:6px 16px;color:#97a0ab}
#crumbs a{color:#e8eaed}
#map{width:100%;height:340px;display:block}
#info{padding:6px 16px;background:#141820;border-top:1px solid #262c36}
#info button{padding:2px 10px;margin-left:8px}
</style>
</head>
<body>
<div id="top"><h1>PS5 DirStat</h1><button id="scan">Scan</button><span id="state"></span><span id="totals"></span></div>
<div class="row head"><span class="tw"></span><span class="nm">Name</span><span class="bar">Share</span><span class="sz">Size</span><span class="pc">%</span><span class="it">Items</span></div>
<div id="tree"></div>
<div id="crumbs"></div>
<canvas id="map"></canvas>
<div id="info"></div>
<script src="/treemap.js"></script>
<script src="/app.js"></script>
</body>
</html>
