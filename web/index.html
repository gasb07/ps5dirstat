<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS5 DirStat</title>
<script>
if (!(window.CSS && CSS.supports && CSS.supports('display', 'grid'))) location.replace('/legacy');
</script>
<style>
:root{--bg:#0e1116;--panel:#141820;--line:#262c36;--text:#e8eaed;--dim:#97a0ab;--accent:#3d7bfd;--tree-h:45vh}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 sans-serif;display:grid;
  grid-template-rows:auto auto var(--tree-h) 8px auto minmax(160px,1fr) auto}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
#state{color:var(--dim);flex:1 1 240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#totals{font-weight:bold}
button{font:inherit;color:var(--text);background:var(--accent);border:0;border-radius:8px;padding:6px 16px;cursor:pointer}
button:focus,.row:focus{outline:2px solid #ffd400;outline-offset:-2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) 110px 84px 60px 70px;gap:8px;align-items:center;padding:3px 16px;cursor:pointer;white-space:nowrap}
.row>span{overflow:hidden;text-overflow:ellipsis}
.head{color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel);cursor:default}
.tw{min-width:14px;color:var(--dim)}
.bar{height:10px;background:var(--line);border-radius:3px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:3px}
.sz,.pc,.it{text-align:right}
.sel{background:#22324f}
#tree{overflow:auto}
#split{background:var(--line);cursor:row-resize;touch-action:none}
#crumbs{padding:6px 16px;color:var(--dim);white-space:nowrap;overflow-x:auto}
#crumbs a{color:var(--text)}
#map{width:100%;height:100%;display:block}
#info{padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);min-height:34px}
#info button{padding:2px 10px;margin-left:8px}
@media (max-width:600px){.row{grid-template-columns:auto minmax(0,1fr) 60px 76px}.pc,.it{display:none}}
</style>
</head>
<body>
<header><h1>PS5 DirStat</h1><button id="scan">Scan</button><span id="state"></span><span id="totals"></span></header>
<div class="row head"><span class="tw"></span><span>Name</span><span>Share</span><span class="sz">Size</span><span class="pc">%</span><span class="it">Items</span></div>
<div id="tree"></div>
<div id="split" title="Drag to resize"></div>
<div id="crumbs"></div>
<canvas id="map"></canvas>
<div id="info"></div>
<script src="/treemap.js"></script>
<script src="/app.js"></script>
<script>
(function () {
  var s = document.getElementById('split'), t = document.getElementById('tree');
  s.addEventListener('pointerdown', function (e) {
    var y0 = e.clientY, h0 = t.getBoundingClientRect().height;
    s.setPointerCapture(e.pointerId);
    function move(m) {
      document.body.style.setProperty('--tree-h', Math.max(80, h0 + m.clientY - y0) + 'px');
      window.dispatchEvent(new Event('resize'));
    }
    function up() { s.removeEventListener('pointermove', move); s.removeEventListener('pointerup', up); }
    s.addEventListener('pointermove', move);
    s.addEventListener('pointerup', up);
  });
})();
</script>
</body>
</html>
