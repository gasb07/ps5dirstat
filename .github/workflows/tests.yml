name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host tests (${{ matrix.cc }}${{ matrix.sanitize == '1' && ', ASan+UBSan' || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        sanitize: ['0', '1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y xxd
      - name: Buffers, tree, scan, snapshot, treemap, panel server, policy
        env:
          CC: ${{ matrix.cc }}
          SANITIZE: ${{ matrix.sanitize }}
        run: bash test/run.sh

  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck shellcheck
      - name: cppcheck
        run: |
          cppcheck --enable=warning,portability --inline-suppr --error-exitcode=1 --std=c11 \
            --suppress=missingIncludeSystem -I src -i third_party src
      - name: shellcheck
        run: shellcheck --severity=warning build.sh test/run.sh test/policy.sh
